provider_code: openai
display_name: OpenAI
default_chat_model: gpt-4o-mini

models:
  - key: gpt-4o-mini
    display_name: GPT-4o Mini
    description: Modelo generalista rápido y económico.
    capabilities:
      chat: true
      image_generation: false
      agents: true
      embeddings: false
      tools: true
      streaming: true
      structured_output: true
      vision_input: true
      file_input: true
      pdf_input: true
    defaults:
      temperature: 0.2
      top_p: 1.0
      max_output_tokens: 2048
      timeout_seconds: 60
    supported_params:
      temperature:
        supported: true
        default: 0.2
        min: 0.0
        max: 2.0
      top_p:
        supported: true
        default: 1.0
        min: 0.0
        max: 1.0
      max_output_tokens:
        supported: true
        default: 2048
        min: 1
      timeout_seconds:
        supported: true
        default: 60
        min: 1
      tools:
        supported: true
      tool_choice:
        supported: true
      stream:
        supported: true
    attachment_policy:
      mode: hybrid
      max_attachments: 10
      max_file_size_mb: 20
      accepted_mime_types:
        - application/pdf
        - image/png
        - image/jpeg
        - image/webp
        - image/gif
        - text/plain
        - text/markdown
        - application/json
        - text/csv
    tags:
      - chat
      - economical
      - vision

