  - key: gpt-image-1
    display_name: GPT Image 1
    description: Modelo habilitado para generación de imágenes.
    capabilities:
      chat: false
      image_generation: true
      agents: false
      embeddings: false
      tools: false
      streaming: false
      structured_output: false
      vision_input: false
      file_input: true
      pdf_input: true
    defaults:
      timeout_seconds: 120
    supported_params:
      size:
        supported: true
        default: "1024x1024"
        allowed_values:
          - "1024x1024"
          - "1536x1024"
          - "1024x1536"
      quality:
        supported: true
        default: "medium"
        allowed_values:
          - "low"
          - "medium"
          - "high"
      timeout_seconds:
        supported: true
        default: 120
        min: 1
    attachment_policy:
      mode: extract_text
      max_attachments: 5
      max_file_size_mb: 10
      accepted_mime_types:
        - text/plain
        - text/markdown
        - application/json
        - text/csv
    tags:
      - image-generation

