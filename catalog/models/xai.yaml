provider_code: xai
display_name: xAI
default_chat_model: grok-beta

models:
  - key: grok-beta
    display_name: Grok Beta
    description: Modelo de chat general vía xAI.
    capabilities:
      chat: true
      image_generation: false
      agents: true
      embeddings: false
      tools: true
      streaming: true
      structured_output: true
      vision_input: false
      file_input: true
      pdf_input: true
    defaults:
      temperature: 0.2
      top_p: 1.0
      max_output_tokens: 2048
      timeout_seconds: 60
    supported_params:
      temperature:
        supported: true
        default: 0.2
        min: 0.0
        max: 2.0
      top_p:
        supported: true
        default: 1.0
        min: 0.0
        max: 1.0
      max_output_tokens:
        supported: true
        default: 2048
        min: 1
      timeout_seconds:
        supported: true
        default: 60
        min: 1
      tools:
        supported: true
      tool_choice:
        supported: true
      stream:
        supported: true
    attachment_policy:
      mode: extract_text
      max_attachments: 5
      max_file_size_mb: 10
      accepted_mime_types:
        - text/plain
        - text/markdown
        - application/json
        - text/csv
    tags:
      - chat
      - general-purpose

