provider_code: google
display_name: Google
default_chat_model: gemini-1.5-flash

models:
  - key: gemini-1.5-flash
    display_name: Gemini 1.5 Flash
    description: Modelo rápido, útil para chat general y multimodalidad.
    capabilities:
      chat: true
      image_generation: false
      agents: true
      embeddings: false
      tools: true
      streaming: true
      structured_output: true
      vision_input: true
    defaults:
      temperature: 0.2
      top_p: 1.0
      max_output_tokens: 2048
      timeout_seconds: 60
    supported_params:
      temperature:
        supported: true
        default: 0.2
        min: 0.0
        max: 2.0
      top_p:
        supported: true
        default: 1.0
        min: 0.0
        max: 1.0
      max_output_tokens:
        supported: true
        default: 2048
        min: 1
      timeout_seconds:
        supported: true
        default: 60
        min: 1
      tools:
        supported: true
      tool_choice:
        supported: true
      stream:
        supported: true
    tags:
      - chat
      - multimodal
      - fast

  - key: gemini-1.5-pro
    display_name: Gemini 1.5 Pro
    description: Modelo más capaz para razonamiento y contexto largo.
    capabilities:
      chat: true
      image_generation: false
      agents: true
      embeddings: false
      tools: true
      streaming: true
      structured_output: true
      vision_input: true
    defaults:
      temperature: 0.2
      top_p: 1.0
      max_output_tokens: 4096
      timeout_seconds: 60
    supported_params:
      temperature:
        supported: true
        default: 0.2
        min: 0.0
        max: 2.0
      top_p:
        supported: true
        default: 1.0
        min: 0.0
        max: 1.0
      max_output_tokens:
        supported: true
        default: 4096
        min: 1
      timeout_seconds:
        supported: true
        default: 60
        min: 1
      tools:
        supported: true
      tool_choice:
        supported: true
      stream:
        supported: true
    tags:
      - chat
      - multimodal
      - premium