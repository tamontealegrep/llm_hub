provider_code: anthropic
display_name: Anthropic
default_chat_model: claude-3-5-sonnet-latest

models:
  - key: claude-3-5-sonnet-latest
    display_name: Claude 3.5 Sonnet
    description: Modelo balanceado para razonamiento y tool use.
    capabilities:
      chat: true
      image_generation: false
      agents: true
      embeddings: false
      tools: true
      streaming: true
      structured_output: true
      vision_input: true
    defaults:
      temperature: 0.2
      top_p: 1.0
      max_output_tokens: 4096
      timeout_seconds: 60
    supported_params:
      temperature:
        supported: true
        default: 0.2
        min: 0.0
        max: 1.0
      top_p:
        supported: true
        default: 1.0
        min: 0.0
        max: 1.0
      max_output_tokens:
        supported: true
        default: 4096
        min: 1
      timeout_seconds:
        supported: true
        default: 60
        min: 1
      tools:
        supported: true
      tool_choice:
        supported: true
      stream:
        supported: true
    tags:
      - chat
      - reasoning
      - tools

  - key: claude-3-5-haiku-latest
    display_name: Claude 3.5 Haiku
    description: Modelo rápido y económico para chat general.
    capabilities:
      chat: true
      image_generation: false
      agents: true
      embeddings: false
      tools: true
      streaming: true
      structured_output: true
      vision_input: true
    defaults:
      temperature: 0.2
      top_p: 1.0
      max_output_tokens: 2048
      timeout_seconds: 60
    supported_params:
      temperature:
        supported: true
        default: 0.2
        min: 0.0
        max: 1.0
      top_p:
        supported: true
        default: 1.0
        min: 0.0
        max: 1.0
      max_output_tokens:
        supported: true
        default: 2048
        min: 1
      timeout_seconds:
        supported: true
        default: 60
        min: 1
      tools:
        supported: true
      tool_choice:
        supported: true
      stream:
        supported: true
    tags:
      - chat
      - economical