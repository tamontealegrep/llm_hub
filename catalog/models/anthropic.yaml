provider_code: anthropic
display_name: Anthropic
default_chat_model: claude-haiku-4-5

models:
  - key: claude-sonnet-4-5
    display_name: Claude 4.5 Sonnet
    description: Modelo balanceado para razonamiento y tool use.
    capabilities:
      chat: true
      image_generation: false
      agents: true
      embeddings: false
      tools: true
      streaming: true
      structured_output: true
      vision_input: true
      file_input: true
      pdf_input: true  
    defaults:
      temperature: 0.2
      top_p: 1.0
      max_output_tokens: 4096
      timeout_seconds: 60
    supported_params:
      temperature:
        supported: true
        default: 0.2
        min: 0.0
        max: 1.0
      top_p:
        supported: true
        default: 1.0
        min: 0.0
        max: 1.0
      max_output_tokens:
        supported: true
        default: 4096
        min: 1
      timeout_seconds:
        supported: true
        default: 60
        min: 1
      tools:
        supported: true
      tool_choice:
        supported: true
      stream:
        supported: true
    attachment_policy:
      mode: hybrid
      max_attachments: 10
      max_file_size_mb: 20
      accepted_mime_types:
        - application/pdf
        - image/png
        - image/jpeg
        - image/webp
        - image/gif
        - text/plain
        - text/markdown
        - application/json
        - text/csv
    tags:
      - chat
      - reasoning
      - tools

